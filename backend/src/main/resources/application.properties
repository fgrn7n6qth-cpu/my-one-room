spring.application.name=backend
spring.config.import=optional:file:./.mail-local.properties,optional:file:./backend/.mail-local.properties
server.port=8082
app.storage.users-file=${APP_USERS_FILE:./data/users.json}
app.storage.workspaces-file=${APP_WORKSPACES_FILE:./data/workspaces.json}
app.auth.tokens-file=${APP_TOKENS_FILE:./data/auth-tokens.json}
app.auth.email-verifications-file=${APP_EMAIL_VERIFICATIONS_FILE:./data/email-verifications.json}
app.auth.token-ttl=${APP_AUTH_TOKEN_TTL:PT12H}
app.auth.email-verification-ttl=${APP_EMAIL_VERIFICATION_TTL:PT10M}
app.auth.email-verification-resend-cooldown=${APP_EMAIL_VERIFICATION_RESEND_COOLDOWN:PT30S}
app.auth.email-verification-required=${APP_EMAIL_VERIFICATION_REQUIRED:true}
app.auth.mail.from=${APP_MAIL_FROM:no-reply@myoneroom.local}
app.cors.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173}
app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED:false}
spring.mail.properties.mail.smtp.ssl.enable=${SPRING_MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST:*}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT:5000}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT:5000}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT:5000}

spring.security.oauth2.client.registration.kakao.client-id=${KAKAO_CLIENT_ID:disabled-kakao-client}
spring.security.oauth2.client.registration.kakao.client-secret=${KAKAO_CLIENT_SECRET:disabled-kakao-secret}
spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=profile_nickname,account_email
spring.security.oauth2.client.registration.kakao.client-name=Kakao
spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

spring.security.oauth2.client.registration.naver.client-id=${NAVER_CLIENT_ID:disabled-naver-client}
spring.security.oauth2.client.registration.naver.client-secret=${NAVER_CLIENT_SECRET:disabled-naver-secret}
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.client-name=Naver
spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.token-uri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.user-info-uri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.user-name-attribute=response
